<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .con{
            height: 100vh;
            /* border:1px solid black; */
            align-items:center;
            display: flex;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            /* border: 1px solid black; */
            display: flex;
        }
        .left, .center, .right{
            height: 100%;
            /* border: 1px solid black; */
        } 
        .left{
            background-color: navy;
            width: 3%;
            border-radius: 20px;
        }
        .center{
            background-color: whitesmoke;
            width: 62%;
            font-size: 150px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            color: navy;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .right{
            width: 35%;
            border-radius: 20px;
            box-shadow: 10px 10px 10px;
            
        }
        .top{
            height: 30%;
            /* border: 1px solid black; */
        }
        .bottom{
            height: 70%;
            /* border: 1px solid black; */
        }
        .top-in{
          border-top-left-radius: 20px;
          border-top-right-radius: 20px;
           height: 90%;
           background-color: navy; 
        }
        .circle{
            height: 150px;
            width: 150px;
            position: absolute;
            top: 15%;
            right: 19%;
            border: 6px solid navy;
            border-radius: 50%;
        }
        img{
            border: 2px solid white;
            height: 100%;
            width: 100%;
            border-radius: 50%;
        }
        .bottom>h1{
            line-height: 50px;
            text-align: center;
        }
        .button{
            height: 20%;
            /* border: 1px solid black; */
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            
        }
        .button1{
            border-radius: 20px;
            color: white;
            height: 50%;
            width: 100px;
            background-color: navy;
            text-align: center;
            line-height: 40px;
        }
        .icon{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-instagram{
            background: linear-gradient( purple, red, yellow,orange);
            color: transparent;
            background-clip: text;
        }
        .fa-linkdin{
            color:blueviolet;
        }
        .fa-behance{
            color: blue
        }
        .fa-gitup{
            color: violet;
        }
        a:hover{
            transform: scale(1.2);
            transition: 35 ease-in;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center"><p>Profile Card UI UX Design</p></div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="Capture.PNG" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Website Developer</h1>
                    <h1>Dezyne Ecole College</h1>
                    <h1>BCA 1st Year</h1>
                    <div class="icon">
                        <a href=""><i class="fa fa-brands fa-facebook fa-2x"></i></a>
                        <a href=""><i class="fa fa-brands fa-instagram fa-2x"></i></a>
                        <a href=""><i class="fa fa-brands fa-linkedin fa-2x"></i></a>
                        <a href=""><i class="fa fa-brands fa-github fa-2x"></i></a>
                        <a href=""><i class="fa fa-brands fa-behance fa-2x"></i></a>
                    </div>
                    <div class="button">
                        <a href=""><div class="button1">Subscribe</div></a>
                        <a href=""><div class="button1">Message</div></a>
                    </div>
                    <div class="icon">
                    <i class="fa fa-solid fa-heart"></i>30K
                    <i class="fa fa-solid fa-comment"></i>5K
                    <i class="fa fa-solid fa-share"></i>3.4K       
                </div>
            </div>
        </div>
    </div>
</body>
</html>
